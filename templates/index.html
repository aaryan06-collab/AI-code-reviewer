<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="watermark">AB</div>
    <div class="bg-glow"></div>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-code"></i></div>
                <div>
                    <h1 data-i18n="title">AI Code Reviewer</h1>
                    <p data-i18n="subtitle">Get instant AI-powered code reviews</p>
                </div>
            </div>
            <div class="controls-top">
                <div class="lang-selector">
                    <i class="fas fa-globe"></i>
                    <select id="ui-lang">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="mr">Marathi</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="pt">Portuguese</option>
                        <option value="ko">Korean</option>
                    </select>
                </div>
                <button class="icon-btn history-toggle" id="history-toggle" title="Review History">
                    <i class="fas fa-clock-rotate-left"></i>
                </button>
            </div>
        </header>

        <div id="history-panel" class="card history-panel hidden">
            <div class="history-header">
                <h3><i class="fas fa-clock-rotate-left"></i> Review History</h3>
                <div class="history-actions">
                    <label class="history-save-toggle">
                        <input type="checkbox" id="save-history">
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Save history</span>
                    </label>
                    <button class="icon-btn danger-btn" id="clear-history" title="Clear History">
                        <i class="fas fa-trash-can"></i>
                    </button>
                </div>
            </div>
            <div id="history-list" class="history-list">
                <p class="history-empty">No reviews yet. Enable "Save history" to start.</p>
            </div>
        </div>

        <main>
            <div class="card drop-card">
                <div id="drop-zone">
                    <div class="drop-content">
                        <div class="drop-icon-wrap">
                            <i class="fas fa-cloud-arrow-up"></i>
                        </div>
                        <p class="drop-text" data-i18n="drop_text">Drag & drop your file here</p>
                        <span class="drop-or" data-i18n="drop_or">or</span>
                        <label for="file-input" class="browse-btn">
                            <i class="fas fa-folder-open"></i> <span data-i18n="browse">Browse Files</span>
                        </label>
                        <input type="file" id="file-input" accept=".py,.js,.ts,.jsx,.tsx,.java,.cpp,.c,.h,.cs,.go,.rs,.rb,.php,.html,.css,.sql,.sh,.yml,.yaml,.json,.md,.swift,.kt,.scala,.r,.m,.pl,.lua,.dart,.svelte,.vue">
                    </div>
                    <div id="file-info" class="file-info hidden">
                        <i class="fas fa-file-code file-icon"></i>
                        <span id="file-name"></span>
                        <button id="remove-file" class="remove-btn" title="Remove"><i class="fas fa-xmark"></i></button>
                    </div>
                </div>
            </div>

            <div class="card options-card">
                <div class="option-row">
                    <label data-i18n="review_lang_label">Review Language</label>
                    <select id="review-lang">
                        <option value="English">English</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Marathi">Marathi</option>
                        <option value="Spanish">Spanish</option>
                        <option value="French">French</option>
                        <option value="German">German</option>
                        <option value="Japanese">Japanese</option>
                        <option value="Chinese">Chinese</option>
                        <option value="Portuguese">Portuguese</option>
                        <option value="Korean">Korean</option>
                    </select>
                </div>
                <button id="review-btn" class="review-btn" disabled>
                    <i class="fas fa-wand-magic-sparkles"></i> <span data-i18n="review">Review Code</span>
                </button>
            </div>

            <div id="loading" class="card loading-card hidden">
                <div class="loader">
                    <div class="loader-bar"></div>
                    <div class="loader-bar"></div>
                    <div class="loader-bar"></div>
                </div>
                <p data-i18n="analyzing">Analyzing your code...</p>
            </div>

            <div id="error" class="card error-card hidden">
                <i class="fas fa-circle-exclamation"></i>
                <p id="error-text"></p>
            </div>

            <div id="result" class="card result-card hidden">
                <div class="result-actions">
                    <button class="icon-btn" id="copy-review" title="Copy Review">
                        <i class="fas fa-copy"></i>
                        <span class="btn-tooltip">Copied!</span>
                    </button>
                    <button class="icon-btn" id="export-review" title="Download as Markdown">
                        <i class="fas fa-download"></i>
                    </button>
                </div>
                <div id="review-content"></div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Aaryan Bansal. All rights reserved.</p>
        </footer>
    </div>

    <script>
    const i18n = {
        en: { title:"AI Code Reviewer", subtitle:"Get instant AI-powered code reviews", drop_text:"Drag & drop your file here", drop_or:"or", browse:"Browse Files", review_lang_label:"Review Language", review:"Review Code", analyzing:"Analyzing your code...", error_network:"Network error. Is the server running?", error_empty:"Please select a file first." },
        hi: { title:"AI कोड समीक्षक", subtitle:"तुरंत AI-संचालित कोड समीक्षा प्राप्त करें", drop_text:"अपनी फ़ाइल यहाँ खींचें और छोड़ें", drop_or:"या", browse:"फ़ाइलें ब्राउज़ करें", review_lang_label:"समीक्षा भाषा", review:"कोड समीक्षा करें", analyzing:"आपके कोड का विश्लेषण हो रहा है...", error_network:"नेटवर्क त्रुटि। क्या सर्वर चल रहा है?", error_empty:"कृपया पहले एक फ़ाइल चुनें।" },
        mr: { title:"AI कोड समीक्षक", subtitle:"त्वरित AI-शक्तीवर आधारित कोड समीक्षा मिळवा", drop_text:"तुमची फाइल येथे ड्रॅग करा आणि सोडा", drop_or:"किंवा", browse:"फाइलं ब्राउज करा", review_lang_label:"समीक्षा भाषा", review:"कोड समीक्षा करा", analyzing:"तुमच्या कोडचे विश्लेषण होत आहे...", error_network:"नेटवर्क त्रुटी. सर्वर चालू आहे का?", error_empty:"कृपया प्रथम एक फाइल निवडा." },
        es: { title:"Revisor de Código AI", subtitle:"Obtén revisiones de código impulsadas por IA", drop_text:"Arrastra y suelta tu archivo aquí", drop_or:"o", browse:"Examinar Archivos", review_lang_label:"Idioma de Revisión", review:"Revisar Código", analyzing:"Analizando tu código...", error_network:"Error de red. ¿El servidor está funcionando?", error_empty:"Por favor selecciona un archivo primero." },
        fr: { title:"Réviseur de Code AI", subtitle:"Obtenez des revues de code alimentées par l'IA", drop_text:"Glissez et déposez votre fichier ici", drop_or:"ou", browse:"Parcourir les Fichiers", review_lang_label:"Langue de Révision", review:"Réviser le Code", analyzing:"Analyse de votre code...", error_network:"Erreur réseau. Le serveur est-il en marche ?", error_empty:"Veuillez d'abord sélectionner un fichier." },
        de: { title:"AI Code-Prüfer", subtitle:"Erhalte sofortige KI-gestützte Code-Reviews", drop_text:"Datei hierher ziehen und ablegen", drop_or:"oder", browse:"Dateien Durchsuchen", review_lang_label:"Prüfsprache", review:"Code Prüfen", analyzing:"Ihr Code wird analysiert...", error_network:"Netzwerkfehler. Läuft der Server?", error_empty:"Bitte wählen Sie zuerst eine Datei aus." },
        ja: { title:"AI コードレビュアー", subtitle:"AI搭載のコードレビューを即座に取得", drop_text:"ファイルをここにドラッグ＆ドロップ", drop_or:"または", browse:"ファイルを選択", review_lang_label:"レビュー言語", review:"コードをレビュー", analyzing:"コードを分析中...", error_network:"ネットワークエラー。サーバーは稼働していますか？", error_empty:"まずファイルを選択してください。" },
        zh: { title:"AI 代码审查器", subtitle:"获取即时 AI 驱动的代码审查", drop_text:"将文件拖放到此处", drop_or:"或", browse:"浏览文件", review_lang_label:"审查语言", review:"审查代码", analyzing:"正在分析您的代码...", error_network:"网络错误。服务器是否在运行？", error_empty:"请先选择一个文件。" },
        pt: { title:"Revisor de Código AI", subtitle:"Obtenha revisões de código com IA", drop_text:"Arraste e solte seu arquivo aqui", drop_or:"ou", browse:"Procurar Arquivos", review_lang_label:"Idioma da Revisão", review:"Revisar Código", analyzing:"Analisando seu código...", error_network:"Erro de rede. O servidor está funcionando?", error_empty:"Por favor, selecione um arquivo primeiro." },
        ko: { title:"AI 코드 리뷰어", subtitle:"즉시 AI 기반 코드 리뷰 받기", drop_text:"파일을 여기에 드래그 앤 드롭", drop_or:"또는", browse:"파일 찾아보기", review_lang_label:"리뷰 언어", review:"코드 리뷰", analyzing:"코드 분석 중...", error_network:"네트워크 오류. 서버가 실행 중인가요?", error_empty:"먼저 파일을 선택해 주세요." }
    };

    let currentLang = 'en';
    let lastReviewRaw = '';
    let lastReviewFilename = '';

    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const fileInfo = document.getElementById('file-info');
    const fileNameEl = document.getElementById('file-name');
    const removeFile = document.getElementById('remove-file');
    const reviewBtn = document.getElementById('review-btn');
    const reviewLang = document.getElementById('review-lang');
    const uiLang = document.getElementById('ui-lang');
    const loading = document.getElementById('loading');
    const errorDiv = document.getElementById('error');
    const errorText = document.getElementById('error-text');
    const result = document.getElementById('result');
    const reviewContent = document.getElementById('review-content');
    const copyBtn = document.getElementById('copy-review');
    const exportBtn = document.getElementById('export-review');
    const historyToggle = document.getElementById('history-toggle');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');
    const saveHistoryCheck = document.getElementById('save-history');
    const clearHistoryBtn = document.getElementById('clear-history');

    let selectedFile = null;

    function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[lang] && i18n[lang][key]) el.textContent = i18n[lang][key];
        });
        document.documentElement.lang = lang;
    }

    uiLang.addEventListener('change', () => setLang(uiLang.value));

    ['dragenter','dragover'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.remove('dragover'); }));
    dropZone.addEventListener('drop', e => { if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

    function handleFile(file) {
        selectedFile = file;
        fileNameEl.textContent = file.name;
        fileInfo.classList.remove('hidden');
        dropZone.querySelector('.drop-content').classList.add('hidden');
        dropZone.classList.add('has-file');
        reviewBtn.disabled = false;
        reviewBtn.classList.add('ready');
    }

    removeFile.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedFile = null;
        fileInput.value = '';
        fileInfo.classList.add('hidden');
        dropZone.querySelector('.drop-content').classList.remove('hidden');
        dropZone.classList.remove('has-file');
        reviewBtn.disabled = true;
        reviewBtn.classList.remove('ready');
    });

    function markdownToHtml(text) {
        let html = text
            .replace(/^### \[Severity: (\w+)\] (.+)$/gm, '<h3 class="severity-$1"><span class="severity-badge severity-badge-$1">$1</span> $2</h3>')
            .replace(/^### (.+)$/gm, '<h3>$1</h3>')
            .replace(/^## (.+)$/gm, '<h2>$1</h2>')
            .replace(/^- \*\*(.+?)\*\*: (.+)$/gm, '<li><strong>$1:</strong> $2</li>')
            .replace(/^- (.+)$/gm, '<li>$1</li>')
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>');
        return '<p>' + html + '</p>';
    }

    reviewBtn.addEventListener('click', async () => {
        if (!selectedFile) { errorText.textContent = i18n[currentLang].error_empty; errorDiv.classList.remove('hidden'); return; }

        loading.classList.remove('hidden');
        errorDiv.classList.add('hidden');
        result.classList.add('hidden');
        reviewBtn.disabled = true;

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('review_lang', reviewLang.value);

        try {
            const response = await fetch('/review', { method: 'POST', body: formData });
            const data = await response.json();
            if (response.ok) {
                lastReviewRaw = data.review;
                lastReviewFilename = selectedFile.name;
                reviewContent.innerHTML = markdownToHtml(data.review);
                result.classList.remove('hidden');
                setTimeout(() => result.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                if (saveHistoryCheck.checked) saveToHistory(selectedFile.name, data.review, reviewLang.value);
            } else {
                errorText.textContent = data.error;
                errorDiv.classList.remove('hidden');
            }
        } catch (err) {
            errorText.textContent = i18n[currentLang].error_network;
            errorDiv.classList.remove('hidden');
        } finally {
            loading.classList.add('hidden');
            reviewBtn.disabled = false;
        }
    });

    copyBtn.addEventListener('click', () => {
        if (!lastReviewRaw) return;
        navigator.clipboard.writeText(lastReviewRaw).then(() => {
            copyBtn.classList.add('copied');
            setTimeout(() => copyBtn.classList.remove('copied'), 2000);
        });
    });

    exportBtn.addEventListener('click', () => {
        if (!lastReviewRaw) return;
        const blob = new Blob([lastReviewRaw], { type: 'text/markdown' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = lastReviewFilename.replace(/\.[^.]+$/, '') + '_review.md';
        a.click();
        URL.revokeObjectURL(url);
    });

    historyToggle.addEventListener('click', () => {
        historyPanel.classList.toggle('hidden');
    });

    function getHistory() {
        return JSON.parse(localStorage.getItem('review_history') || '[]');
    }

    function saveToHistory(filename, review, lang) {
        const history = getHistory();
        history.unshift({ filename, review, lang, timestamp: new Date().toISOString() });
        if (history.length > 10) history.length = 10;
        localStorage.setItem('review_history', JSON.stringify(history));
        renderHistory();
    }

    function renderHistory() {
        const history = getHistory();
        if (!history.length) {
            historyList.innerHTML = '<p class="history-empty">No reviews yet. Enable "Save history" to start.</p>';
            return;
        }
        historyList.innerHTML = history.map((item, i) => {
            const date = new Date(item.timestamp).toLocaleDateString();
            const time = new Date(item.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            return `<div class="history-item" data-index="${i}">
                <div class="history-item-info">
                    <i class="fas fa-file-code"></i>
                    <div>
                        <span class="history-filename">${item.filename}</span>
                        <span class="history-meta">${date} ${time} &middot; ${item.lang}</span>
                    </div>
                </div>
                <button class="icon-btn history-load" data-index="${i}" title="Load review">
                    <i class="fas fa-arrow-up-right-from-square"></i>
                </button>
            </div>`;
        }).join('');

        historyList.querySelectorAll('.history-load').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const idx = parseInt(btn.dataset.index);
                const item = history[idx];
                lastReviewRaw = item.review;
                lastReviewFilename = item.filename;
                reviewContent.innerHTML = markdownToHtml(item.review);
                result.classList.remove('hidden');
                setTimeout(() => result.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
                historyPanel.classList.add('hidden');
            });
        });
    }

    saveHistoryCheck.addEventListener('change', () => {
        localStorage.setItem('save_history_enabled', saveHistoryCheck.checked);
        renderHistory();
    });

    clearHistoryBtn.addEventListener('click', () => {
        localStorage.removeItem('review_history');
        renderHistory();
    });

    (function initHistory() {
        const enabled = localStorage.getItem('save_history_enabled') === 'true';
        saveHistoryCheck.checked = enabled;
        renderHistory();
    })();
    </script>
</body>
</html>
